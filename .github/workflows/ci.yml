name: Validação Movement

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # TensorFlow nativo é usado apenas no treino offline, não no dashboard.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run check:sync
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: movement_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: movement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movement_test -d movement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOVEMENT_TEST_DATABASE_URL: postgresql+psycopg://movement_test:ci-only-test-password@localhost:5432/movement_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check app migrations tests scripts
      - run: python -m ruff format --check app migrations tests scripts
      - run: python -m pytest -q
